spring.application.name=condomais-backend

# Configurações do Servidor (Render e outras plataformas informam a porta em PORT)
server.port=${PORT:8080}

# Configurações do Banco de Dados PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/condoplus_db
spring.datasource.username=seu_usuario
spring.datasource.password=sua_senha
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuração do JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Produção: veja application-prod.properties (SPRING_PROFILES_ACTIVE=prod)