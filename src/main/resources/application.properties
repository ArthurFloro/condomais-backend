spring.application.name=condomais-backend

# Configurações do Servidor (Render e outras plataformas informam a porta em PORT)
server.port=${PORT:8080}

# Configurações do Banco de Dados PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/condoplus_db
spring.datasource.username=seu_usuario
spring.datasource.password=sua_senha
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuração do JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Produção: veja application-prod.properties (SPRING_PROFILES_ACTIVE=prod)

# Assistente virtual do morador (Claude API). Sem ANTHROPIC_API_KEY o assistente fica desligado
# (POST /assistente/mensagens responde 503) e o restante da API funciona normalmente.
assistente.anthropic.api-key=${ANTHROPIC_API_KEY:}
assistente.modelo=${ASSISTENTE_MODELO:claude-opus-5-5}
