# Perfil de produção (Render + Neon). Ative com SPRING_PROFILES_ACTIVE=prod.
# Nenhum valor sensível fica aqui: tudo vem de variáveis de ambiente e NÃO há valor padrão.
# Se faltar alguma variável, a aplicação não sobe (melhor do que rodar com segredo inseguro).

# Banco (Neon): use a conexão DIRETA (host sem "-pooler"), com sslmode=require
# Ex.: DATABASE_URL=jdbc:postgresql://ep-xxxx.us-east-2.aws.neon.tech/neondb?sslmode=require
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
# Poucas conexões: o plano gratuito do Neon e o do Render têm limites baixos
spring.datasource.hikari.maximum-pool-size=5

# O schema é criado por docs/sql/deploy/01-schema.sql; em produção o Hibernate só valida
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Segredo de assinatura do JWT (longo e aleatório; nunca reutilize o de desenvolvimento)
api.security.token.secret=${JWT_SECRET}

# URL(s) do front na Vercel, separadas por vírgula. Ex.: https://condomais.vercel.app
api.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# Assistente virtual (opcional, por isso com padrão vazio): defina ASSISTENTE_API_URL no Render com o
# endereço do serviço condomais-assistente (ex.: https://condomais-assistente.onrender.com) para ligá-lo
assistente.api.url=${ASSISTENTE_API_URL:}

# Recuperação de senha por e-mail (opcional, padrão vazio = desligada; POST /auth/recuperar-senha responde 503).
# Envio pela API HTTP do Brevo (o Render gratuito bloqueia SMTP). EMAIL_REMETENTE precisa estar validado no Brevo.
email.brevo.api-key=${BREVO_API_KEY:}
email.remetente=${EMAIL_REMETENTE:}
email.remetente-nome=${EMAIL_REMETENTE_NOME:Condo+}
# Endereço do front usado no link do e-mail; vazio = primeira origem de CORS_ALLOWED_ORIGINS
app.front-url=${FRONT_URL:}
